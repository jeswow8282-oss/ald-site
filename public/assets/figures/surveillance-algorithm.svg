<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 720" role="img"
     aria-labelledby="alg-title alg-desc" font-family="'Pretendard','Noto Sans KR',system-ui,sans-serif">
  <title id="alg-title">ALD 진단 후 추적관찰 알고리즘</title>
  <desc id="alg-desc">ALD로 진단된 남아·남성에서 뇌 MRI와 부신기능 검사를 언제 얼마나 자주 시행하는지, 그리고 뇌병변이 발견되었을 때 어떤 판단이 이어지는지를 보여주는 순서도입니다.</desc>

  <style>
    .box   { fill: none; stroke: currentColor; stroke-width: 1.8; }
    .accent{ fill: none; stroke: currentColor; stroke-width: 2.6; }
    .t     { fill: currentColor; font-size: 15px; text-anchor: middle; }
    .tb    { fill: currentColor; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .sm    { fill: currentColor; font-size: 12.5px; text-anchor: middle; opacity: .72; }
    .lbl   { fill: currentColor; font-size: 13px; opacity: .78; }
    .ln    { stroke: currentColor; stroke-width: 1.8; fill: none; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 진단 -->
  <rect class="box" x="150" y="20" width="270" height="56" rx="4"/>
  <text class="tb" x="285" y="44">ALD 진단</text>
  <text class="sm" x="285" y="65">혈중 긴꼬리지방산 검사 · ABCD1 유전자 검사</text>
  <path class="ln" marker-end="url(#a)" d="M285,76 L285,104"/>

  <!-- 정기 추적 -->
  <rect class="accent" x="110" y="106" width="350" height="106" rx="4"/>
  <text class="tb" x="285" y="131">정기 추적관찰</text>
  <text class="t"  x="285" y="155">뇌 MRI — 만 2세에 기준 촬영</text>
  <text class="t"  x="285" y="175">2~12세 6개월마다 · 12세부터 연 1회</text>
  <text class="t"  x="285" y="199">부신기능 검사 — 생후 6개월 안에 시작</text>

  <!-- 부신 분기 -->
  <path class="ln" marker-end="url(#a)" d="M460,159 L562,159"/>
  <rect class="box" x="562" y="118" width="256" height="82" rx="4"/>
  <text class="tb" x="690" y="143">부신기능 저하가 확인되면</text>
  <text class="t"  x="690" y="165">내분비내과에서 호르몬 보충</text>
  <text class="sm" x="690" y="188">응급 상황 대처 교육이 반드시 필요합니다</text>

  <path class="ln" marker-end="url(#a)" d="M285,212 L285,244"/>

  <!-- 판단 -->
  <path class="accent" d="M285,246 L455,292 L285,338 L115,292 z"/>
  <text class="tb" x="285" y="287">뇌 MRI에서</text>
  <text class="tb" x="285" y="307">병변이 발견되었습니까?</text>

  <!-- 아니요 되돌림 -->
  <text class="lbl" x="20" y="286">아니요</text>
  <path class="ln" marker-end="url(#a)" d="M115,292 L60,292 L60,159 L110,159"/>

  <!-- 네 -->
  <text class="lbl" x="490" y="284">네</text>
  <path class="ln" marker-end="url(#a)" d="M455,292 L562,292"/>

  <!-- 활동성 확인 -->
  <rect class="box" x="562" y="254" width="256" height="76" rx="4"/>
  <text class="tb" x="690" y="279">가돌리늄 조영 MRI</text>
  <text class="sm" x="690" y="301">조영증강 = 병이 지금 활동 중이라는 표시</text>
  <text class="sm" x="690" y="320">범위와 신경학적 기능도 함께 평가</text>

  <!-- 분기 -->
  <path class="ln" d="M690,330 L690,368 M250,368 L690,368"/>
  <path class="ln" marker-end="url(#a)" d="M250,368 L250,400"/>
  <path class="ln" marker-end="url(#a)" d="M690,368 L690,400"/>
  <text class="lbl" x="262" y="392">조영증강 없음 · 안정</text>
  <text class="lbl" x="560" y="392">조영증강 있음</text>

  <!-- 안정 -->
  <rect class="box" x="70" y="402" width="360" height="84" rx="4"/>
  <text class="tb" x="250" y="427">멈춘 것으로 보이는 병변</text>
  <text class="t"  x="250" y="449">3개월 뒤 다시 촬영해 안정 여부 확인</text>
  <text class="sm" x="250" y="471">안정적이면 6개월 간격으로 되돌립니다</text>

  <!-- 이식 평가 -->
  <rect class="accent" x="500" y="402" width="318" height="84" rx="4"/>
  <text class="tb" x="659" y="427">이식 전문가에게 의뢰</text>
  <text class="t"  x="659" y="449">이식 가능 시기인지 판단</text>
  <text class="sm" x="659" y="471">조기에 시행할수록 결과가 좋습니다</text>

  <path class="ln" marker-end="url(#a)" d="M659,486 L659,518"/>
  <rect class="box" x="500" y="520" width="318" height="58" rx="4"/>
  <text class="tb" x="659" y="544">동종 조혈모세포이식</text>
  <text class="sm" x="659" y="565">공여자 선택지가 나쁠 때 유전자치료 고려</text>

  <!-- 주석 -->
  <text class="lbl" x="40" y="620">· 여아·여성에게는 정기적인 대뇌형 선별을 권고하지 않습니다.</text>
  <text class="lbl" x="40" y="644">· 대뇌형이 의심되는 증상이 나타나면 일정과 무관하게 즉시 MRI를 촬영합니다.</text>
  <text class="lbl" x="40" y="668">· 성인 남성은 이식이 선택지로 남아 있는 동안 추적을 계속합니다.</text>
  <text class="lbl" x="40" y="700" opacity=".6">2022년 국제 합의 진료 권고(Neurology)를 바탕으로 작성</text>
</svg>
