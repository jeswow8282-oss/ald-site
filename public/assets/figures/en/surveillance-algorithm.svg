<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 720" role="img"
     aria-labelledby="alg-title alg-desc" font-family="'Pretendard','Noto Sans KR',system-ui,sans-serif">
  <title id="alg-title">Surveillance algorithm after a diagnosis of ALD</title>
  <desc id="alg-desc">A flowchart showing how often brain MRI and adrenal function testing are performed in boys and men diagnosed with ALD, and what follows when a brain lesion is found.</desc>

  <style>
    .box   { fill: none; stroke: currentColor; stroke-width: 1.8; }
    .accent{ fill: none; stroke: currentColor; stroke-width: 2.6; }
    .t     { fill: currentColor; font-size: 15px; text-anchor: middle; }
    .tb    { fill: currentColor; font-size: 15px; font-weight: 700; text-anchor: middle; }
    .sm    { fill: currentColor; font-size: 12.5px; text-anchor: middle; opacity: .72; }
    .lbl   { fill: currentColor; font-size: 13px; opacity: .78; }
    .ln    { stroke: currentColor; stroke-width: 1.8; fill: none; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 진단 -->
  <rect class="box" x="150" y="20" width="270" height="56" rx="4"/>
  <text class="tb" x="285" y="44">Diagnosis of ALD</text>
  <text class="sm" x="285" y="65">Plasma VLCFA · ABCD1 genetic testing</text>
  <path class="ln" marker-end="url(#a)" d="M285,76 L285,104"/>

  <!-- 정기 추적 -->
  <rect class="accent" x="110" y="106" width="350" height="106" rx="4"/>
  <text class="tb" x="285" y="131">Regular surveillance</text>
  <text class="t"  x="285" y="155">Brain MRI — baseline at age 2</text>
  <text class="t"  x="285" y="175">Every 6 months, ages 2–12 · yearly from 12</text>
  <text class="t"  x="285" y="199">Adrenal testing — begins within 6 months of birth</text>

  <!-- 부신 분기 -->
  <path class="ln" marker-end="url(#a)" d="M460,159 L562,159"/>
  <rect class="box" x="562" y="118" width="256" height="82" rx="4"/>
  <text class="tb" x="690" y="143">If adrenal insufficiency is confirmed</text>
  <text class="t"  x="690" y="165">Hormone replacement under endocrinology</text>
  <text class="sm" x="690" y="188">Emergency preparedness is essential</text>

  <path class="ln" marker-end="url(#a)" d="M285,212 L285,244"/>

  <!-- 판단 -->
  <path class="accent" d="M285,246 L455,292 L285,338 L115,292 z"/>
  <text class="tb" x="285" y="287">Lesion seen on</text>
  <text class="tb" x="285" y="307">brain MRI?</text>

  <!-- No 되돌림 -->
  <text class="lbl" x="20" y="286">No</text>
  <path class="ln" marker-end="url(#a)" d="M115,292 L60,292 L60,159 L110,159"/>

  <!-- Yes -->
  <text class="lbl" x="490" y="284">Yes</text>
  <path class="ln" marker-end="url(#a)" d="M455,292 L562,292"/>

  <!-- 활동성 확인 -->
  <rect class="box" x="562" y="254" width="256" height="76" rx="4"/>
  <text class="tb" x="690" y="279">Gadolinium-enhanced MRI</text>
  <text class="sm" x="690" y="301">Enhancement indicates active disease</text>
  <text class="sm" x="690" y="320">Extent and neurological function assessed too</text>

  <!-- 분기 -->
  <path class="ln" d="M690,330 L690,368 M250,368 L690,368"/>
  <path class="ln" marker-end="url(#a)" d="M250,368 L250,400"/>
  <path class="ln" marker-end="url(#a)" d="M690,368 L690,400"/>
  <text class="lbl" x="262" y="392">No enhancement · stable</text>
  <text class="lbl" x="560" y="392">Enhancement present</text>

  <!-- 안정 -->
  <rect class="box" x="70" y="402" width="360" height="84" rx="4"/>
  <text class="tb" x="250" y="427">Apparently arrested lesion</text>
  <text class="t"  x="250" y="449">Repeat at 3 months to confirm stability</text>
  <text class="sm" x="250" y="471">If stable, return to 6-month intervals</text>

  <!-- 이식 평가 -->
  <rect class="accent" x="500" y="402" width="318" height="84" rx="4"/>
  <text class="tb" x="659" y="427">Refer to a transplant specialist</text>
  <text class="t"  x="659" y="449">Assess whether the window is open</text>
  <text class="sm" x="659" y="471">Earlier treatment gives better outcomes</text>

  <path class="ln" marker-end="url(#a)" d="M659,486 L659,518"/>
  <rect class="box" x="500" y="520" width="318" height="58" rx="4"/>
  <text class="tb" x="659" y="544">Allogeneic stem cell transplantation</text>
  <text class="sm" x="659" y="565">Gene therapy if donor options are poor</text>

  <!-- 주석 -->
  <text class="lbl" x="40" y="620">· Routine cerebral surveillance is not recommended for girls and women.</text>
  <text class="lbl" x="40" y="644">· If symptoms suggest cerebral disease, image immediately regardless of schedule.</text>
  <text class="lbl" x="40" y="668">· In adult men, surveillance continues while transplantation remains an option.</text>
  <text class="lbl" x="40" y="700" opacity=".6">Based on the 2022 international consensus recommendations (Neurology)</text>
</svg>
