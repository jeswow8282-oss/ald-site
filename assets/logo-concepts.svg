<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" font-family="'Pretendard','Noto Sans KR',system-ui,sans-serif">
  <rect width="1240" height="980" fill="#fbf9f6"/>

  <style>
    .ink   { fill: #15181c; }
    .deep  { stroke: #1e3d38; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .deepf { fill: #1e3d38; }
    .rule  { stroke: #e0dad1; stroke-width: 1; }
    .cap   { fill: #15181c; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
    .desc  { fill: #6b7580; font-size: 14.5px; }
    .num   { fill: #6b7580; font-size: 12px; font-weight: 700; letter-spacing: .18em; }
    .hd    { fill: #15181c; font-size: 26px; font-weight: 700; font-family: 'Noto Serif KR', serif; }
    .sub   { fill: #6b7580; font-size: 15px; }
    .wm-s  { fill: #1e3d38; font-family: 'Noto Serif KR', serif; font-weight: 600; }
    .wm-k  { fill: #6b7580; }
  </style>

  <text class="hd" x="60" y="66">Korea ALD — 로고 시안</text>
  <text class="sub" x="60" y="96">환자분들이 고르신 1번(사람 + 하트)을 바탕으로, 단색·평면으로 다시 그렸습니다. 색은 사이트 강조색과 같은 짙은 청록입니다.</text>
  <line class="rule" x1="60" y1="124" x2="1180" y2="124"/>

  <!-- ═══════ A ═══════ -->
  <g transform="translate(60,170)">
    <text class="num" x="0" y="0">A</text>
    <g transform="translate(10,26)">
      <!-- 하트 윤곽 -->
      <path class="deep" stroke-width="9"
            d="M60,104 C22,78 8,58 8,40 A21,21 0 0 1 60,26 A21,21 0 0 1 112,40 C112,58 98,78 60,104 Z"/>
      <!-- 사람: 머리 + 두 팔 -->
      <circle class="deepf" cx="60" cy="50" r="9"/>
      <path class="deep" stroke-width="8" d="M60,63 L60,84 M60,68 L40,54 M60,68 L80,54"/>
    </g>
    <text class="cap" x="0" y="182">A. 하트 안의 사람</text>
    <text class="desc" x="0" y="208">환자분들이 고른 1번에 가장 가깝습니다.</text>
    <text class="desc" x="0" y="230">보호받는다는 느낌이 분명합니다.</text>
  </g>

  <!-- ═══════ B ═══════ -->
  <g transform="translate(360,170)">
    <text class="num" x="0" y="0">B</text>
    <g transform="translate(10,26)">
      <!-- 두 사람이 마주보며 하트를 이룸 -->
      <path class="deep" stroke-width="10" d="M58,102 C24,76 12,58 12,42 A20,20 0 0 1 52,32"/>
      <path class="deep" stroke-width="10" d="M62,102 C96,76 108,58 108,42 A20,20 0 0 0 68,32"/>
      <circle class="deepf" cx="44" cy="22" r="10"/>
      <circle class="deepf" cx="76" cy="22" r="10"/>
    </g>
    <text class="cap" x="0" y="182">B. 두 사람이 이루는 하트</text>
    <text class="desc" x="0" y="208">환자와 보호자, 혹은 서로 돕는 관계.</text>
    <text class="desc" x="0" y="230">"함께"라는 뜻이 형태에 들어 있습니다.</text>
  </g>

  <!-- ═══════ C ═══════ -->
  <g transform="translate(660,170)">
    <text class="num" x="0" y="0">C</text>
    <g transform="translate(10,26)">
      <!-- 한 획으로 이어지는 하트 + 사람 -->
      <path class="deep" stroke-width="9"
            d="M60,104 C22,78 8,58 8,40 A21,21 0 0 1 60,26 A21,21 0 0 1 112,40 C112,58 98,78 60,104"/>
      <path class="deep" stroke-width="9" d="M36,58 L60,80 L96,40"/>
    </g>
    <text class="cap" x="0" y="182">C. 이어진 한 획</text>
    <text class="desc" x="0" y="208">하트와 확인 표시가 한 획으로 이어집니다.</text>
    <text class="desc" x="0" y="230">"조기에 찾아낸다"는 뜻을 담습니다.</text>
  </g>

  <!-- ═══════ D ═══════ -->
  <g transform="translate(960,170)">
    <text class="num" x="0" y="0">D</text>
    <g transform="translate(10,26)">
      <!-- 감싸 안는 두 팔 + 가운데 사람 -->
      <path class="deep" stroke-width="10" d="M18,30 C-2,66 10,100 46,104"/>
      <path class="deep" stroke-width="10" d="M102,30 C122,66 110,100 74,104"/>
      <circle class="deepf" cx="60" cy="40" r="11"/>
      <path class="deep" stroke-width="9" d="M60,55 L60,80 M60,61 L38,46 M60,61 L82,46"/>
    </g>
    <text class="cap" x="0" y="182">D. 감싸 안는 품</text>
    <text class="desc" x="0" y="208">하트를 직접 그리지 않고 품으로 표현.</text>
    <text class="desc" x="0" y="230">가장 절제되어 사이트와 잘 맞습니다.</text>
  </g>

  <line class="rule" x1="60" y1="450" x2="1180" y2="450"/>

  <!-- ═══════ 워드마크 조합 ═══════ -->
  <text class="hd" x="60" y="500" font-size="21">이름과 함께 놓았을 때</text>

  <g transform="translate(60,540)">
    <!-- 가로 조합 -->
    <g transform="translate(0,10) scale(0.52)">
      <path class="deep" stroke-width="14"
            d="M60,104 C22,78 8,58 8,40 A21,21 0 0 1 60,26 A21,21 0 0 1 112,40 C112,58 98,78 60,104 Z"/>
      <circle class="deepf" cx="60" cy="50" r="9"/>
      <path class="deep" stroke-width="12" d="M60,63 L60,84 M60,68 L40,54 M60,68 L80,54"/>
    </g>
    <text class="wm-s" x="78" y="46" font-size="30" letter-spacing="2">KOREA ALD</text>
    <text class="wm-k" x="79" y="70" font-size="14.5" letter-spacing=".14em">한국 부신백질이영양증 정보</text>
  </g>

  <g transform="translate(480,540)">
    <g transform="translate(0,10) scale(0.52)">
      <path class="deep" stroke-width="14"
            d="M60,104 C22,78 8,58 8,40 A21,21 0 0 1 60,26 A21,21 0 0 1 112,40 C112,58 98,78 60,104 Z"/>
      <circle class="deepf" cx="60" cy="50" r="9"/>
      <path class="deep" stroke-width="12" d="M60,63 L60,84 M60,68 L40,54 M60,68 L80,54"/>
    </g>
    <text class="wm-s" x="78" y="42" font-size="25" letter-spacing="1">Korea ALD Society</text>
    <text class="wm-k" x="79" y="66" font-size="14" letter-spacing=".1em">KALDS · 한국 ALD 학회</text>
  </g>

  <!-- 작은 크기 확인 -->
  <g transform="translate(900,540)">
    <text class="desc" x="0" y="6">작은 크기에서</text>
    <g transform="translate(0,20) scale(0.30)">
      <path class="deep" stroke-width="16"
            d="M60,104 C22,78 8,58 8,40 A21,21 0 0 1 60,26 A21,21 0 0 1 112,40 C112,58 98,78 60,104 Z"/>
      <circle class="deepf" cx="60" cy="50" r="10"/>
      <path class="deep" stroke-width="14" d="M60,63 L60,84 M60,68 L40,54 M60,68 L80,54"/>
    </g>
    <g transform="translate(60,26) scale(0.18)">
      <path class="deep" stroke-width="22"
            d="M60,104 C22,78 8,58 8,40 A21,21 0 0 1 60,26 A21,21 0 0 1 112,40 C112,58 98,78 60,104 Z"/>
      <circle class="deepf" cx="60" cy="50" r="12"/>
      <path class="deep" stroke-width="18" d="M60,63 L60,84 M60,68 L40,54 M60,68 L80,54"/>
    </g>
    <!-- 파비콘(사각 배경) -->
    <g transform="translate(110,20)">
      <rect width="44" height="44" rx="9" fill="#1e3d38"/>
      <g transform="translate(6,5) scale(0.27)" stroke="#fbf9f6">
        <path fill="none" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"
              d="M60,104 C22,78 8,58 8,40 A21,21 0 0 1 60,26 A21,21 0 0 1 112,40 C112,58 98,78 60,104 Z"/>
        <circle fill="#fbf9f6" stroke="none" cx="60" cy="50" r="12"/>
        <path fill="none" stroke-width="17" stroke-linecap="round" d="M60,63 L60,84 M60,68 L40,54 M60,68 L80,54"/>
      </g>
    </g>
    <text class="desc" x="0" y="86" font-size="13">본문 · 파비콘 크기에서도 형태가 남습니다</text>
  </g>

  <line class="rule" x1="60" y1="680" x2="1180" y2="680"/>

  <!-- ═══════ 색 변형 ═══════ -->
  <text class="hd" x="60" y="722" font-size="21">색 변형</text>
  <text class="sub" x="60" y="748" font-size="14">인쇄물·발표 슬라이드·흑백 팩스까지 견디려면 단색으로 성립해야 합니다.</text>

  <g transform="translate(60,780)">
    <!-- 짙은 청록 -->
    <g transform="scale(0.45)">
      <path class="deep" stroke-width="16" d="M60,104 C22,78 8,58 8,40 A21,21 0 0 1 60,26 A21,21 0 0 1 112,40 C112,58 98,78 60,104 Z"/>
      <circle class="deepf" cx="60" cy="50" r="10"/>
      <path class="deep" stroke-width="14" d="M60,63 L60,84 M60,68 L40,54 M60,68 L80,54"/>
    </g>
    <text class="desc" x="0" y="80" font-size="13">기본 (청록)</text>
  </g>

  <g transform="translate(190,780)">
    <g transform="scale(0.45)" stroke="#15181c">
      <path fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M60,104 C22,78 8,58 8,40 A21,21 0 0 1 60,26 A21,21 0 0 1 112,40 C112,58 98,78 60,104 Z"/>
      <circle fill="#15181c" stroke="none" cx="60" cy="50" r="10"/>
      <path fill="none" stroke-width="14" stroke-linecap="round" d="M60,63 L60,84 M60,68 L40,54 M60,68 L80,54"/>
    </g>
    <text class="desc" x="0" y="80" font-size="13">흑백</text>
  </g>

  <g transform="translate(320,772)">
    <rect x="-10" y="-4" width="120" height="88" fill="#1e3d38"/>
    <g transform="translate(0,8) scale(0.45)" stroke="#fbf9f6">
      <path fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M60,104 C22,78 8,58 8,40 A21,21 0 0 1 60,26 A21,21 0 0 1 112,40 C112,58 98,78 60,104 Z"/>
      <circle fill="#fbf9f6" stroke="none" cx="60" cy="50" r="10"/>
      <path fill="none" stroke-width="14" stroke-linecap="round" d="M60,63 L60,84 M60,68 L40,54 M60,68 L80,54"/>
    </g>
    <text class="desc" x="-10" y="104" font-size="13">반전 (어두운 배경)</text>
  </g>

  <text class="desc" x="500" y="800" font-size="14.5">· 그라디언트를 쓰지 않아 작은 크기와 흑백 인쇄에서 뭉개지지 않습니다.</text>
  <text class="desc" x="500" y="826" font-size="14.5">· 사이트의 짙은 청록(#1E3D38)을 그대로 씁니다.</text>
  <text class="desc" x="500" y="852" font-size="14.5">· 선 굵기가 일정해 확대·축소에 견딥니다.</text>
  <text class="desc" x="500" y="878" font-size="14.5">· 위 워드마크는 A안 기준으로 그렸습니다. 다른 안으로 바꿔 그릴 수 있습니다.</text>
</svg>
